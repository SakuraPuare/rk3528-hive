name: Registry CI/CD

on:
  push:
    branches: [main]
    paths:
      - "management/registry/**"
      - "management/registry-ui/**"
      - ".github/workflows/registry-cicd.yml"
  pull_request:
    paths:
      - "management/registry/**"
      - "management/registry-ui/**"
      - ".github/workflows/registry-cicd.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: management/registry

jobs:
  # ── CI：代码检查 & 构建验证 ───────────────────────────────────
  # 全部 job 仅 GitHub 跑：lint/test/build 是轻量活，丢给 GitHub 免费 runner（且用
  # artifact v4，Gitea 旧版 API 不支持）。本地自托管 develop runner 只留给镜像构建。
  ci-go:
    name: CI (Go)
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: management/registry/go.mod
          cache-dependency-path: management/registry/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build (amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o /dev/null .

      - name: Build (arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o /dev/null .

      - name: Generate OpenAPI (Go -> swagger/openapi)
        run: make openapi

      - name: Upload openapi.yaml
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-openapi-${{ github.sha }}
          path: management/registry/openapi/openapi.yaml
          if-no-files-found: error

  ci-frontend:
    name: CI (Frontend) Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    if: github.server_url == 'https://github.com'
    needs: [ci-go]
    defaults:
      run:
        working-directory: management/registry-ui
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: management/registry-ui/package-lock.json

      - name: Download openapi.yaml
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: registry-openapi-${{ github.sha }}
          path: management/registry/openapi

      - name: Pin npm 10 (Node 24 ships npm 11 whose stricter ci breaks our lockfile)
        if: matrix.node-version >= 24
        run: npm install -g npm@10

      - name: Install registry-ui deps
        run: npm ci

      - name: Generate TS client + Zod
        run: npm run gen-api

      - name: Type check
        run: npm run typecheck

      - name: React Doctor (health check)
        run: npm run doctor

      - name: Run tests
        run: npm test

      - name: Next.js build (static export)
        run: npm run build

      - name: Upload registry-ui out (frontend artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-ui-out-${{ github.sha }}-node${{ matrix.node-version }}
          path: management/registry-ui/out
          if-no-files-found: error

  # ── CD：编译产物 & 部署（仅 main 分支）──────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ci-go, ci-frontend]
    if: >-
      github.server_url == 'https://github.com' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: management/registry/go.mod
          cache-dependency-path: management/registry/go.sum

      - name: Build amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o hive-registry-amd64 .

      - name: Build arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o hive-registry-arm64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hive-registry-${{ github.sha }}
          path: |
            management/registry/hive-registry-amd64
            management/registry/hive-registry-arm64
